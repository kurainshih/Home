<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Kurain Home 每日技術新聞">
  <title>Kurain News — 每日技術新聞</title>
  <link rel="stylesheet" href="./css/news.css">
  <script src="./js/news.js" defer></script>
</head>
<body>
  <header class="top shell">
    <a class="brand" href="./index.html"><span>K</span><strong>Kurain Home</strong></a>
    <nav><a href="./index.html">首頁</a><a class="active" href="./news.html">新聞</a><a href="./history.html">歷史新聞</a></nav>
  </header>
  <main class="shell">
    <section class="hero">
      <p class="eyebrow">CURATED TECH NEWS</p>
      <h1>每天只看<br><em>值得看的技術新聞。</em></h1>
      <p>聚焦程式語言、AI 與開源 LLM、電腦硬體零組件。首頁只顯示當日內容，舊新聞永久保留於歷史新聞頁。</p>
      <div class="meta">最新更新：<strong id="updatedAt">讀取中…</strong> · <strong id="newsCount">0</strong> 則</div>
    </section>
    <section class="toolbar">
      <div id="tabs">
        <button class="active" data-category="all">全部</button>
        <button data-category="programming">程式語言</button>
        <button data-category="ai-llm">AI 與開源 LLM</button>
        <button data-category="hardware">電腦硬體零組件</button>
      </div>
      <input id="search" type="search" placeholder="搜尋新聞…">
    </section>
    <section>
      <div class="heading"><div><p class="eyebrow">TODAY'S STORIES</p><h2>今日技術新聞</h2></div><p id="resultMeta"></p></div>
      <div id="newsGrid" class="grid"></div>
      <div id="empty" class="empty" hidden>目前沒有符合條件的新聞。</div>
      <div id="error" class="empty" hidden>新聞資料暫時無法載入。</div>
    </section>
  </main>
  <footer class="shell">Kurain News · 摘要僅供快速閱讀，重要資訊請以原始來源為準。</footer>
</body>
</html>
